<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alpha Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#14213d;--mute:#5d6b85;--line:#d9dfea;--brand:#2b4cff;--ok:#0e8f5b;--warn:#b57a00;--bad:#c23b3b;--okbg:#e1f4ea;--warnbg:#fff1d0;--badbg:#fbe4e4;--brandbg:#e5eaff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--card:#171f35;--ink:#e8ecf7;--mute:#98a4c0;--line:#2a3452;--brand:#7d93ff;--ok:#4cd39a;--warn:#f0b840;--bad:#ff8585;--okbg:#12332a;--warnbg:#3a2f10;--badbg:#3b1b1f;--brandbg:#1f2a52}}
:root[data-theme="dark"]{--bg:#0e1424;--card:#171f35;--ink:#e8ecf7;--mute:#98a4c0;--line:#2a3452;--brand:#7d93ff;--ok:#4cd39a;--warn:#f0b840;--bad:#ff8585;--okbg:#12332a;--warnbg:#3a2f10;--badbg:#3b1b1f;--brandbg:#1f2a52}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,sans-serif;margin:0}
.wrap{max-width:600px;margin:0 auto;padding:16px 16px 90px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.logo{font:800 24px 'Bricolage Grotesque',sans-serif;letter-spacing:-.5px}.logo i{font-style:normal;color:var(--brand)}
.tag{color:var(--mute);font-size:13px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg{overflow-x:auto}.seg button{flex:1 0 auto;white-space:nowrap;border:0;background:none;color:var(--mute);font:600 14px Figtree;padding:8px 10px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card.tap{cursor:pointer}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 5px}
input[type=text],input[type=number],input[type=date],select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:16px Figtree}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.btn{border:0;border-radius:12px;padding:14px;font:700 16px Figtree;cursor:pointer;background:var(--brand);color:#fff;width:100%}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:9px 10px;font-size:14px;border-radius:9px}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px}
.p-pending{background:var(--warnbg);color:var(--warn)}.p-approved{background:var(--okbg);color:var(--ok)}.p-rejected,.p-flag{background:var(--badbg);color:var(--bad)}.p-clarify{background:var(--brandbg);color:var(--brand)}
.lvl{display:flex;gap:3px;align-items:center;font-size:12px;color:var(--mute)}.lvl b{width:14px;height:6px;border-radius:3px;background:var(--line)}.lvl b.f{background:var(--brand)}
.item{display:flex;justify-content:space-between;gap:10px}
.a{font:700 19px 'Bricolage Grotesque';white-space:nowrap}
.meta{color:var(--mute);font-size:13px}.mono{font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;cursor:pointer;font:inherit;color:inherit}
.stat.on{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.stat b{display:block;font:800 24px 'Bricolage Grotesque'}.stat span{font-size:12px;color:var(--mute)}
.big{background:var(--ink);color:var(--bg);border-radius:14px;padding:16px;margin-bottom:12px}
.big b{font:800 32px 'Bricolage Grotesque';display:block}.big span{opacity:.75;font-size:13px}
.flags{margin:8px 0 0;padding:0;list-style:none}.flags li{background:var(--badbg);color:var(--bad);border-radius:8px;padding:6px 9px;font-size:13px;margin-top:5px}
.acts{display:flex;gap:6px;margin-top:10px}.acts .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;z-index:9}
.toast.on{opacity:1}
.hint{font-size:13px;color:var(--mute);margin:6px 0 0}.empty{text-align:center;color:var(--mute);padding:26px 10px}
.upl{display:flex;gap:8px}.upl .btn{flex:1}
.prev{margin-top:10px;position:relative}.prev img{max-width:100%;max-height:200px;border-radius:10px;display:block}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl td,.tbl th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}.tbl .n{text-align:right;white-space:nowrap}.tbl th{color:var(--mute);font-weight:600;font-size:12px}
.tl{margin:0;padding:0 0 0 14px;list-style:none;border-left:2px solid var(--line)}.tl li{position:relative;padding:0 0 12px 12px}.tl li:before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--brand)}
.hash{font:12px ui-monospace,Menlo,monospace;color:var(--mute)}
.ln{display:grid;grid-template-columns:1fr 54px 92px 28px;gap:6px;margin-bottom:6px}.ln input{padding:9px}
.x{border:0;background:none;color:var(--bad);font-size:20px;cursor:pointer}
.back{border:0;background:none;color:var(--brand);font:600 15px Figtree;cursor:pointer;padding:4px 0 10px}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:14px}.chk input{margin-top:4px;width:18px;height:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="wrap">
<header><div><div class="logo">Alpha <i>Tracker</i></div><div class="tag">Proof for every payment. Control for every shelf.</div></div></header>
<div class="seg" id="mainseg"><button id="tE" onclick="go('e')">Employee</button><button id="tO" onclick="go('o')">Owner</button><button id="tL" onclick="go('l')">Ledger</button><button id="tA" onclick="go('a')">Audit</button><button id="tS" onclick="go('s')">Inventory</button><button id="tV" onclick="go('v')">Vendor</button></div>
<div id="who"></div><main id="app"></main>
</div>
<div class="toast" id="toast" role="status"></div>
<input id="f1" type="file" accept="image/*" capture="environment" style="position:absolute;left:-9999px" onchange="pick(this)">
<input id="f2" type="file" accept="image/*,application/pdf" style="position:absolute;left:-9999px" onchange="pick(this)">
<script>
const CATS={'Transportation':['6100','Transport expense'],'Materials':['5100','Materials purchased'],'Casual labour':['6200','Casual labour expense'],'Meals':['6300','Meals and entertainment'],'Vehicle maintenance':['6400','Vehicle repairs'],'Other':['6900','Sundry expense']};
const CASH=['1010','Cash on hand'],PAY=['2100','Employee reimbursements payable'];
const NOREC=['Transporter does not issue receipts','Casual labour','Market purchase','Emergency expense','Other'];
let ME='Staff';const OWNER='Owner';
const N=v=>'₦'+Number(v).toLocaleString('en-NG');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago=m=>NOW()-m*60000;
const fmt=t=>new Date(t).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const rel=t=>{const m=Math.round((NOW()-t)/60000);return m<60?m+' min ago':m<1440?Math.round(m/60)+' hr ago':Math.round(m/1440)+' d ago'};
const hsh=s=>{let x=5381;for(const c of s)x=((x<<5)+x+c.charCodeAt(0))>>>0;return x.toString(16).padStart(8,'0')};
const total=x=>x.lines.reduce((s,l)=>s+l.q*l.p,0);
let S={tab:'e',view:'list',sel:null,filter:'all',items:[],je:[],next:1,jn:1};
let F=null;
function ev(x,who,what,t){const p=x.log.length?x.log[x.log.length-1].h:'0';t=t||NOW();x.log.push({t,who,what,h:hsh(p+who+what+t)})}
function post(x,t){const cr=x.src==='Personal'?PAY:CASH,no='JE-'+String(S.jn++).padStart(4,'0');
 const l=x.lines.map(z=>({acc:CATS[x.cat][0],name:CATS[x.cat][1],dr:z.q*z.p,cr:0,memo:z.d}));l.push({acc:cr[0],name:cr[1],dr:0,cr:total(x),memo:x.src==='Personal'?'Owed to '+x.emp:'Cash paid out'});
 S.je.push({no,t,xid:x.id,lines:l});x.je=no;ev(x,'System','Posted '+no+': Dr '+CATS[x.cat][1]+', Cr '+cr[1]+' '+N(total(x)),t)}
function seed(){const D=[
['John','Transportation','Delivery to Kaduna depot','Roadside driver','Personal',[['Transport fare',1,45000]],35,'pending',0,'Transporter does not issue receipts'],
['John','Transportation','Supplier pickup','Roadside driver','Personal',[['Transport fare',1,38000]],1200,'pending',0,'Transporter does not issue receipts'],
['John','Transportation','Return trip','Roadside driver','Personal',[['Transport fare',1,41000]],1800,'pending',0,'Transporter does not issue receipts'],
['David','Transportation','Delivery to Wuse','Musa Transport','Company cash',[['Haulage to Wuse',1,10000],['Loading fee',1,2500]],300,'approved',1],
['Paul','Vehicle maintenance','Hilux service','ABC Motors','Company cash',[['Brake pads',2,6500],['Labour',1,5500]],420,'approved',1],
['David','Transportation','Goods to Garki market','Tricycle rider','Company cash',[['Tricycle hire',2,4000]],1560,'approved',1],
['Amaka','Meals','Team lunch, site visit','Mama Put Kitchen','Personal',[['Jollof rice and chicken',8,2500],['Drinks',8,250]],540,'pending',1],
['Paul','Transportation','Fuel top-up','Filling station','Company cash',[['Petrol (litres)',12,650]],3000,'approved',1],
['Paul','Transportation','Courier to Lugbe','Dispatch rider','Company cash',[['Courier fee',1,14600]],180,'pending',1],['Paul','Transportation','Abuja to Lagos','Peace Mass Transit','Company cash',[['Bus fare',1,1500]],2880,'approved',1],['John','Transportation','Abuja to Lagos','Peace Mass Transit','Personal',[['Bus fare',1,4000]],90,'pending',1]];
 D.forEach(d=>{const x={id:S.next++,emp:d[0],cat:d[1],purpose:d[2],to:d[3],src:d[4],lines:d[5].map(l=>({d:l[0],q:l[1],p:l[2]})),photo:!!d[8],noRec:!d[8],why:d[9],loc:'Abuja',t:ago(d[6]),status:d[7],log:[]};
  ev(x,x.emp,'Submitted '+N(total(x)),x.t);if(x.photo)ev(x,x.emp,'Receipt photo attached',x.t+1000);else ev(x,x.emp,'No receipt: '+x.why,x.t+1000);ev(x,x.emp,'Signed business-purpose declaration',x.t+2000);
  if(x.status==='approved'){ev(x,OWNER,'Approved',x.t+600000);post(x,x.t+601000)}if(x.purpose==='Abuja to Lagos'){x.rf='Abuja';x.rt='Lagos'}if(x.photo)x.gps=true;if(x.status==='pending'){x.cpr='CF-'+(4000+S.next*13);ev(x,'System','Confirmation request sent to '+x.to+' ('+x.cpr+')',x.t+3000)}if(x.to==='ABC Motors'||x.to==='Musa Transport'){x.ext={amt:total(x),sup:x.to,match:true};x.cp={by:x.to,method:'Link',t:x.t+3600000};ev(x,'AI','Read receipt: '+N(total(x))+' from '+x.to+' (matches claim)',x.t+3000);ev(x,x.to,'Confirmed receiving '+N(total(x))+' by Link',x.t+3600000)}if(x.to==='Musa Transport'){x.bank='BANK-4471AB';ev(x,'System','Matched bank record: '+N(total(x)),x.t+7200000)}S.items.push(x)})}
S.inv=[];S.wo=[];S.sl=[];S.sales=[];S.mv=[];S.cnt=[];S.users=[];S.wr=[];S.bl=[];S.sub='ov';S.dp=30;S.gp=0;
S.tab=S.tab||'e';
let DB=null,OWN=true,wq=Promise.resolve();
const save=()=>{if(!DB)return toast('Not connected, so this change is not saved');const d=Object.assign({},S);['tab','view','sel','filter','sub','vn','rg','me','gm','hint'].forEach(k=>delete d[k]);const js=JSON.stringify(d);window._pend=(window._pend||0)+1;wq=wq.then(()=>DB.doc('app/state').set({d:js})).catch(e=>toast('Could not save: '+(e.message||e.code))).finally(()=>{window._pend--})};
const toast=m=>{const t=document.getElementById('toast');t.textContent=m;t.className='toast on';setTimeout(()=>t.className='toast',2400)};
const level=x=>1+(x.photo?1:0)+(x.ext&&x.ext.match?1:0)+(x.gps?1:0)+(x.cp?1:0)+(x.bank?1:0);
function flags(x){const f=[];
 if(!x.photo)f.push('No supporting document');if(x.ext&&!x.ext.match)f.push('Receipt shows '+N(x.ext.amt)+' but the claim is '+N(total(x)));
 const pr=S.items.filter(y=>y.emp===x.emp&&y.cat===x.cat&&y.id!==x.id&&y.t<x.t&&y.status!=='rejected');
 if(pr.length>=2){const a=pr.reduce((s,y)=>s+total(y),0)/pr.length;if(total(x)>a*1.5)f.push('Much higher than '+x.emp+"'s usual "+x.cat.toLowerCase()+' claims (avg '+N(Math.round(a))+')')}
 const sim=S.items.filter(y=>y.emp===x.emp&&y.cat===x.cat&&Math.abs(y.t-x.t)<172800000);if(sim.length>=3)f.push(sim.length+' similar claims within 2 days');
 if(x.src==='Personal'&&total(x)>=20000&&!x.photo)f.push('Large personal payment with no photo');
 const q=S.items.filter(y=>y.emp===x.emp&&y.cat===x.cat&&Math.abs(y.t-x.t)<20*60000);if(q.length>=3)f.push(q.length+' similar claims within 20 minutes');
 const vf=S.items.filter(y=>y.to===x.to&&y.status!=='rejected'&&Math.abs(y.t-x.t)<3*864e5);if(vf.length>=3)f.push(x.to+' has received unusually frequent payments ('+vf.length+' in 3 days)');
 const hr=new Date(x.t).getHours();if(hr>=21||hr<6||new Date(x.t).getDay()===0)f.push('Submitted outside normal work pattern ('+new Date(x.t).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})+')');
 bm(x).forEach(m=>f.push(m));if(x.cpd)f.push(x.cpd.amt?'Vendor says it received '+N(x.cpd.amt)+' but the claim is '+N(total(x)):'Vendor says it did not receive this payment');
 return f}
const flagged=x=>x.status==='pending'&&flags(x).length>0;
function go(t){S.tab=t;S.view='list';S.filter='all';render()}
function lv(n){return '<span class="lvl">'+[1,2,3,4,5,6].map(i=>'<b class="'+(i<=n?'f':'')+'"></b>').join('')+'&nbsp;Evidence '+n+'/6</span>'}
function pill(x){return flagged(x)?'<span class="pill p-flag">Flagged</span>':'<span class="pill p-'+x.status+'">'+({pending:'Pending',approved:'Approved',rejected:'Rejected',clarify:'Question open'})[x.status]+'</span>'}
function card(x,own){return '<div class="card tap" onclick="open_('+x.id+')"><div class="item"><div><b>'+esc(x.cat)+'</b> · '+esc(x.purpose)+'<div class="meta">'+(own?esc(x.emp)+' · ':'')+'Paid to '+esc(x.to)+' · '+x.lines.length+' line'+(x.lines.length>1?'s':'')+'</div><div class="meta">'+rel(x.t)+' · '+esc(x.loc)+'</div></div><div class="a">'+N(total(x))+'</div></div><div class="item" style="margin-top:8px;align-items:center">'+lv(level(x))+pill(x)+'</div></div>'}
function open_(id){S.sel=id;S.view='detail';render();scrollTo(0,0)}
function act(id,s){const x=S.items.find(i=>i.id===id);if(!OWN)return toast('Only the owner can do this');if(s==='approved'&&x.emp===ME)return toast('You cannot approve your own claim');x.status=s;
 if(s==='approved'){ev(x,ME,'Approved');post(x)}else if(s==='rejected')ev(x,ME,'Rejected');else ev(x,ME,'Asked '+x.emp+' to explain this expense');
 save();toast(({approved:'Approved and posted '+x.je,rejected:'Expense rejected',clarify:'Question sent to '+x.emp})[s]);render()}
function reply(id){const x=S.items.find(i=>i.id===id),r=document.getElementById('rp').value.trim();if(!r)return toast('Type your reply first');ev(x,x.emp,'Replied: '+r);x.status='pending';save();toast('Reply sent');render()}
function detail(){const x=S.items.find(i=>i.id===S.sel),own=S.tab==='o',f=flags(x),je=S.je.find(j=>j.no===x.je);
 return '<button class="back" onclick="S.view=\'list\';render()">‹ Back</button><div class="card"><div class="item"><div><h2 style="font-size:20px">'+esc(x.cat)+'</h2><div class="meta">'+esc(x.purpose)+'</div></div><div class="a">'+N(total(x))+'</div></div>'
 +'<div class="meta" style="margin:8px 0">'+esc(x.emp)+' · paid to '+esc(x.to)+' · '+esc(x.src)+' · '+fmt(x.t)+' · '+esc(x.loc)+'</div><div class="item" style="align-items:center">'+lv(level(x))+pill(x)+'</div>'
 +(f.length?'<ul class="flags">'+f.map(m=>'<li>'+esc(m)+'</li>').join('')+'</ul>':'')+'</div>'
 +'<div class="card"><h3 style="font-size:16px;margin-bottom:6px">Line items</h3><table class="tbl mono"><tr><th>Item</th><th class="n">Qty</th><th class="n">Price</th><th class="n">Amount</th></tr>'+x.lines.map(l=>'<tr><td>'+esc(l.d)+'</td><td class="n">'+l.q+'</td><td class="n">'+N(l.p)+'</td><td class="n">'+N(l.q*l.p)+'</td></tr>').join('')+'<tr><td colspan="3"><b>Total</b></td><td class="n"><b>'+N(total(x))+'</b></td></tr></table></div>'
 +ladder(x)+hcard(x)+'<div class="card"><h3 style="font-size:16px;margin-bottom:6px">Document</h3>'+(x.img?'<div id="im" class="meta">Loading receipt…</div>':x.photo?'<div class="meta">Receipt photo on file (sample record, no image stored).</div>':'<div class="meta">No receipt. Reason: '+esc(x.why||'declared')+'.</div>')+'</div>'
 +'<div class="card"><h3 style="font-size:16px;margin-bottom:6px">Accounting posting</h3>'+(je?jeHtml(je):'<div class="meta">Nothing posted yet. The entry is created when the owner approves.</div>')+'</div>'
 +'<div class="card"><h3 style="font-size:16px;margin-bottom:10px">Audit trail</h3><ul class="tl">'+x.log.map(e=>'<li><b>'+esc(e.what)+'</b><div class="meta">'+esc(e.who)+' · '+fmt(e.t)+'</div><div class="hash">#'+e.h+'</div></li>').join('')+'</ul></div>'
 +(own&&OWN&&(x.status==='pending'||x.status==='clarify')?'<div class="acts"><button class="btn sm ok" onclick="act('+x.id+',\'approved\')">Approve and post</button><button class="btn sm ghost" onclick="act('+x.id+',\'clarify\')">Ask why</button><button class="btn sm bad" onclick="act('+x.id+',\'rejected\')">Reject</button></div>':'')
 +(!own&&S.tab==='e'&&x.status==='clarify'?'<div class="card"><label for="rp" style="margin-top:0">Reply to the owner</label><input type="text" id="rp" placeholder="Explain this expense"><button class="btn" style="margin-top:10px" onclick="reply('+x.id+')">Send reply</button></div>':'')}
function jeHtml(j){return '<div class="meta" style="margin-bottom:4px"><b style="color:var(--ink)">'+j.no+'</b> · '+fmt(j.t)+'</div><table class="tbl mono"><tr><th>Account</th><th class="n">Debit</th><th class="n">Credit</th></tr>'+j.lines.map(l=>'<tr><td>'+(l.cr?'&nbsp;&nbsp;&nbsp;':'')+l.acc+' '+esc(l.name)+(l.memo?'<div class="meta">'+esc(l.memo)+'</div>':'')+'</td><td class="n">'+(l.dr?N(l.dr):'')+'</td><td class="n">'+(l.cr?N(l.cr):'')+'</td></tr>').join('')+'</table>'}
function ledger(){const tb={};S.je.forEach(j=>j.lines.forEach(l=>{const k=l.acc+' '+l.name;tb[k]=tb[k]||[0,0];tb[k][0]+=l.dr;tb[k][1]+=l.cr}));
 const ks=Object.keys(tb).sort(),dr=ks.reduce((s,k)=>s+tb[k][0],0),cr=ks.reduce((s,k)=>s+tb[k][1],0);
 return '<div class="card"><h3 style="margin-bottom:6px">Trial balance</h3><table class="tbl mono"><tr><th>Account</th><th class="n">Debit</th><th class="n">Credit</th></tr>'+ks.map(k=>'<tr><td>'+esc(k)+'</td><td class="n">'+(tb[k][0]?N(tb[k][0]):'')+'</td><td class="n">'+(tb[k][1]?N(tb[k][1]):'')+'</td></tr>').join('')+'<tr><td><b>Total</b></td><td class="n"><b>'+N(dr)+'</b></td><td class="n"><b>'+N(cr)+'</b></td></tr></table><p class="hint">'+(dr===cr?'Debits equal credits.':'Out of balance.')+' Only approved expenses are posted.</p></div>'

+R(x.ext&&x.ext.match,'Level 3 · AI reads the receipt',x.ext?'Receipt shows '+N(x.ext.amt)+(x.ext.sup?' from '+esc(x.ext.sup):'')+(x.ext.match?'. Matches the claim.':'. Does NOT match the claim.'):'Not read yet',!x.ext&&x.img===true?'<button class="btn sm ghost" style="margin-top:6px" onclick="aiRead('+x.id+')">Read receipt with AI</button>':'')

function reconc(){const lc=S.cnt[S.cnt.length-1];let h=alertCard();
 if(!lc)return h+'<div class="card"><b>No stock count yet.</b><p class="meta">Open Stock take, count the shelf without looking at the records, then compare.</p></div>'+mvtbl();
 const i=S.cnt.length-1,st=cst(lc),miss=lc.rows.some(x=>x.cnt<x.sys),over=lc.rows.filter(x=>x.cnt>x.sys),own=S.mv.filter(m=>m.who===lc.by&&m.t<lc.t&&lc.t-m.t<30*864e5&&lc.rows.some(x=>x.pid===m.pid)).length;
 h+='<div class="card"><h3 style="font-size:16px;margin-bottom:2px">Latest count</h3><div class="meta" style="margin-bottom:8px">'+fmt(lc.t)+' · counted by '+esc(lc.by)+'</div><table class="tbl mono"><tr><th>Batch</th><th class="n">Records</th><th class="n">Counted</th><th class="n">Result</th></tr>'
 +lc.rows.map(x=>{const d=x.cnt-x.sys;return '<tr><td>'+esc(x.name)+'</td><td class="n">'+x.sys+'</td><td class="n">'+x.cnt+'</td><td class="n" style="color:'+(d<0?'var(--bad)':d>0?'var(--warn)':'var(--ok)')+'">'+(d<0?'missing '+(-d)+' ('+N(-d*x.cost)+')':d>0?d+' extra':'OK')+'</td></tr>'}).join('')+'</table>'
 +'<p style="margin:10px 0 0"><b>Missing: '+N(Math.round(st.ms))+'</b> · '+(st.rate*100).toFixed(1)+'% of the stock counted</p>'
 +(over.length?'<p class="hint">'+over.length+' batch(es) have more on the shelf than the records show. Check that a delivery or return was not left out.</p>':'')
 +(own?'<p class="hint" style="color:var(--bad)">'+esc(lc.by)+' also recorded '+own+' movements for these products in the last 30 days. For a fair count, ask someone who does not handle this stock.</p>':'')
 +(miss&&!lc.posted?'<button class="btn bad" style="margin-top:10px" onclick="postCt('+i+')">Write off missing stock</button>':lc.posted?'<p class="hint">Missing stock was written off and posted to the ledger.</p>':'')+'</div>';
 const old=S.cnt.slice(0,-1).reverse();
 if(old.length)h+='<div class="card"><h3 style="font-size:16px;margin-bottom:6px">Earlier counts</h3><table class="tbl mono"><tr><th>When</th><th class="n">Missing</th></tr>'+old.map(c=>{const s=cst(c);return '<tr><td>'+fmt(c.t)+'<div class="meta">'+esc(c.by)+'</div></td><td class="n">'+N(Math.round(s.ms))+'<div class="meta">'+(s.rate*100).toFixed(1)+'%</div></td></tr>'}).join('')+'</table></div>';
 return h+mvtbl()}

function busy(){const a=document.activeElement&&document.activeElement.tagName;return /INPUT|TEXTAREA|SELECT/.test(a||'')||[...document.querySelectorAll('#app input,#app textarea')].some(e=>e.type!=='checkbox'&&e.type!=='file'&&e.value!=='')}

function ph(n,p){return hsh('alpha|'+String(n).toLowerCase()+'|'+p)}
function gate(){document.getElementById('mainseg').style.display='none';document.getElementById('who').innerHTML='';
 const k=sessionStorage.getItem('alpha_me'),u=(S.users||[]).find(x=>x.name===k);if(u){login(u,1);return}
 const m=S.gm||'in',us=S.users||[];
 document.getElementById('app').innerHTML='<div class="card"><h2 style="font-size:20px;margin-bottom:4px">'+(m==='in'?'Sign in':'Create your login')+'</h2><p class="hint" style="margin:0 0 6px">'+(us.length?'Pick your own name and a 4-digit PIN. Everything you do is recorded under your name.':'No accounts yet. The first account created becomes the Owner.')+'</p><label>Your name</label><input type="text" id="ln" autocomplete="off" placeholder="e.g. Amaka"><label>4-digit PIN</label><input type="password" id="lp" inputmode="numeric" maxlength="4" placeholder="••••">'+(m==='up'?'<label>Confirm PIN</label><input type="password" id="lp2" inputmode="numeric" maxlength="4" placeholder="••••">':'')+'<button class="btn" style="margin-top:14px" onclick="'+(m==='in'?'doIn()':'doUp()')+'">'+(m==='in'?'Sign in':'Create account')+'</button><button class="btn ghost" style="margin-top:8px" onclick="S.gm=\''+(m==='in'?'up':'in')+'\';render()">'+(m==='in'?'New here? Create a login':'I already have a login')+'</button>'+(S.hint?'<p class="hint">'+esc(S.hint)+'</p>':'')+'</div>'}
function login(u,quiet){S.me={name:u.name,role:u.role};ME=u.name;OWN=u.role==='Owner';sessionStorage.setItem('alpha_me',u.name);if(!quiet){sev('Signed in',0);save()}render()}
function doIn(){const n=document.getElementById('ln').value.trim(),p=document.getElementById('lp').value,u=(S.users||[]).find(x=>x.name.toLowerCase()===n.toLowerCase());
 if(!u||u.pin!==ph(u.name,p))return toast('Wrong name or PIN');login(u)}
function doUp(){const n=document.getElementById('ln').value.trim(),p=document.getElementById('lp').value,q=document.getElementById('lp2').value;
 if(n.length<2||n.length>30)return toast('Enter a name of 2 to 30 characters');if(!/^\d{4}$/.test(p))return toast('The PIN must be 4 digits');if(p!==q)return toast('The two PINs do not match');
 if((S.users||[]).some(x=>x.name.toLowerCase()===n.toLowerCase()))return toast('That name is taken. Sign in or pick another.');
 const u={name:n,pin:ph(n,p),role:S.users.length?'Staff':'Owner',t:NOW()};S.users.push(u);ME=n;sev('Created account ('+u.role+')',0);save();toast(u.role==='Owner'?'Account created. You are the Owner.':'Account created.');login(u,1)}
function signOut(){sev('Signed out',0);save();sessionStorage.removeItem('alpha_me');S.me=null;S.gm='in';render()}
function applyRole(){const o=S.me.role==='Owner';OWN=o;ME=S.me.name;document.getElementById('mainseg').style.display='';
 [['tO',o],['tL',o],['tA',o],['tV',o]].forEach(p=>document.getElementById(p[0]).style.display=p[1]?'':'none');
 if(!o&&['o','l','a','v'].includes(S.tab))S.tab='e';
 document.getElementById('who').innerHTML='<div class="hint" style="margin:-4px 0 10px">Signed in as <b>'+esc(ME)+'</b> ('+S.me.role+') · <a href="#" onclick="signOut();return false" style="color:var(--brand)">Sign out</a></div>'}
function teamCard(){if(!OWN||!(S.users||[]).length)return '';return '<div class="card" style="margin-top:14px"><h3 style="font-size:16px;margin-bottom:6px">Team and roles</h3><table class="tbl">'+S.users.map((u,i)=>'<tr><td>'+esc(u.name)+'<div class="meta">'+u.role+'</div></td><td class="n">'+(u.name===ME?'<span class="meta">You</span>':'<button class="btn ghost sm" style="width:auto" onclick="setRole('+i+')">Make '+(u.role==='Owner'?'Staff':'Owner')+'</button> <button class="btn ghost sm" style="width:auto" onclick="resetPin('+i+')">Reset PIN</button>')+'</td></tr>').join('')+'</table><p class="hint">Staff can submit expenses and receive, sell and count stock. Only owners approve, write off, and see the ledger and audit trail.</p></div>'}
function setRole(i){const u=S.users[i];if(!OWN||u.name===ME)return;u.role=u.role==='Owner'?'Staff':'Owner';sev('Changed role of '+u.name+' to '+u.role,0);save();render()}
function resetPin(i){const u=S.users[i];if(!OWN)return;u.pin=ph(u.name,'0000');sev('Reset PIN for '+u.name,0);save();toast('PIN for '+u.name+' is now 0000')}

function NOW(){return new Date().getTime()+(window.CLK||0)}
function applyMd(p,pct){const o=p.price;p.price=Math.round(p.price*(1-pct/100));sev('Marked down '+p.name+' '+pct+'% ('+N(o)+' to '+N(p.price)+')',0)}
function disc(id){const p=S.inv.find(i=>i.id===id);if(!OWN){if(S.wr.some(x=>x.status==='pending'&&x.pid===id&&x.type==='markdown'))return toast('A request for this batch is already waiting');S.wr.push({id:NOW(),t:NOW(),by:ME,type:'markdown',pid:id,name:p.name,pct:S.dp,reason:'Near expiry',status:'pending'});sev('Requested '+S.dp+'% markdown of '+p.name,0);save();toast('Request sent to the owner for approval');return render()}applyMd(p,S.dp);save();toast('Price reduced to '+N(p.price));render()}
function wo(id,r){const p=S.inv.find(i=>i.id===id),q=r==='Damaged'?p.dmg:p.qty;
 if(!OWN){if(S.wr.some(x=>x.status==='pending'&&x.pid===id&&x.type==='writeoff'))return toast('A request for this batch is already waiting');S.wr.push({id:NOW(),t:NOW(),by:ME,type:'writeoff',pid:id,name:p.name,q,reason:r,amt:q*p.cost,status:'pending'});sev('Requested write-off of '+q+' x '+p.name+' ('+r+')',q*p.cost);save();toast('Request sent to the owner for approval');return render()}
 doWO(p,r,q);save();toast('Written off '+N(q*p.cost)+' and posted to the ledger');render()}
function reqCard(){const l=(S.wr||[]).filter(r=>OWN?r.status==='pending':r.by===ME&&NOW()-r.t<7*864e5).sort((a,b)=>b.t-a.t);if(!l.length)return '';
 return '<div class="card"><h3 style="font-size:16px;margin-bottom:6px">'+(OWN?'Stock requests waiting for you':'My stock requests')+'</h3>'+l.map(r=>'<div style="padding:8px 0;border-bottom:1px solid var(--line)"><b>'+(r.type==='markdown'?'Mark down '+r.pct+'%':'Write off '+r.q+' units')+': '+esc(r.name)+'</b><div class="meta">'+esc(r.by)+' · '+esc(r.reason)+(r.type==='markdown'?'':' · '+N(r.amt)+' at cost')+' · '+fmt(r.t)+' · '+r.status+'</div>'+(OWN&&r.status==='pending'?'<div class="acts"><button class="btn sm ok" onclick="decide('+r.id+',1)">Approve</button><button class="btn sm bad" onclick="decide('+r.id+',0)">Reject</button></div>':'')+'</div>').join('')+'</div>'}
function decide(id,ok){if(!OWN)return toast('Only the owner can do this');const r=S.wr.find(x=>x.id===id);if(!r||r.status!=='pending')return;if(r.by===ME)return toast('You cannot approve your own request');r.by2=ME;r.t2=NOW();
 if(!ok){r.status='rejected';sev('Rejected '+r.by+'’s request: '+r.name,0);save();toast('Request rejected');return render()}
 const p=S.inv.find(i=>i.id===r.pid);r.status='approved';
 if(p){if(r.type==='markdown')applyMd(p,r.pct);else{const q=Math.min(r.q,p.qty);if(q>0){doWO(p,r.reason,q);sev('Approved the write-off requested by '+r.by,0)}}}
 save();toast('Approved');render()}
function vcOk(id){const x=S.items.find(i=>i.id===id),e=document.getElementById('vc'+id),c=((e&&e.value)||'').trim().toUpperCase();if(c!==x.cpr){toast('Wrong code. Use the code the vendor was given.');return false}return true}
function nm(s){return norm(s).split(' ').filter(w=>w.length>=3&&!['the','and','ltd','limited','transfer','payment','from','for','pos','nip','trf'].includes(w))}
function bankCard(){const bl=S.bl||[],pos=bl.filter(b=>b.state==='possible'),un=bl.filter(b=>b.state==='unmatched'),mt=bl.filter(b=>b.state==='matched').length;
return '<div class="card"><h3 style="margin-bottom:4px">Bank reconciliation</h3><p class="hint" style="margin:0 0 8px">Paste lines from the company bank statement as date, amount, description, one per line. Use plain numbers without commas. Example: 2026-10-17, 12500, TRANSFER MUSA TRANSPORT. A line counts as verified only if the amount, the date and the supplier name all agree, and each bank line can be used once.</p><textarea id="bk" rows="4" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:14px ui-monospace,monospace"></textarea><button class="btn" style="margin-top:8px" onclick="recon()">Match to expenses</button><div id="bkr">'+(bl.length?'<p style="margin:10px 0 0"><b>'+mt+' matched</b> · '+pos.length+' need review · '+un.length+' unmatched</p>':'')
+pos.map(b=>'<div style="padding:8px 0;border-top:1px solid var(--line)"><b>'+N(b.amt)+'</b> '+esc(b.desc)+'<div class="meta">Same amount as a claim, but the supplier name differs. Is it the same payment?</div>'+b.cands.map(id=>{const x=S.items.find(i=>i.id===id);return x&&!x.bank?'<button class="btn sm ghost" style="margin-top:6px" onclick="acceptB(\''+b.ref+'\','+id+')">Accept for '+esc(x.emp)+' → '+esc(x.to)+'</button>':''}).join('')+'</div>').join('')
+un.map(b=>'<div class="meta" style="padding:6px 0;border-top:1px solid var(--line)">Unmatched: '+N(b.amt)+' '+esc(b.desc)+' ('+b.ref+'). Money left the account with no recorded expense. Investigate.</div>').join('')+'</div></div>'}
function recon(){if(!OWN)return toast('Only the owner can do this');const ls=document.getElementById('bk').value.split('\n').map(l=>l.trim()).filter(Boolean),seen={};let dup=0;
 ls.forEach(l=>{const p=l.split(','),t=Date.parse((p[0]||'').trim()),a=+String(p[1]||'').replace(/[^0-9.]/g,''),d=p.slice(2).join(',').trim();seen[l]=(seen[l]||0)+1;const ref='BANK-'+hsh(l+'#'+seen[l]).slice(0,6).toUpperCase();
  if(S.bl.some(b=>b.ref===ref)){dup++;return}
  const c=S.items.filter(i=>!i.bank&&i.status!=='rejected'&&total(i)===a&&(isNaN(t)||Math.abs(i.t-t)<=3*864e5)),w=nm(d),g=c.find(i=>nm(i.to).some(k=>w.includes(k))),rec={ref,t:isNaN(t)?NOW():t,amt:a,desc:d,xid:null,state:'unmatched'};
  if(g){g.bank=ref;rec.xid=g.id;rec.state='matched';ev(g,'System','Bank record '+ref+' matched: '+N(a)+' '+d)}else if(c.length){rec.state='possible';rec.cands=c.map(i=>i.id)}
  S.bl.push(rec)});save();render();if(dup)toast(dup+' line(s) were already used and were skipped')}
function acceptB(ref,id){const b=S.bl.find(x=>x.ref===ref),x=S.items.find(i=>i.id===id);if(!OWN||!b||!x||b.state!=='possible'||x.bank)return;x.bank=ref;b.state='matched';b.xid=id;ev(x,ME,'Accepted bank record '+ref+' although the supplier name differs ('+b.desc+')');save();render()}

function nm(s){const G=['the','and','ltd','limited','transfer','payment','from','for','pos','nip','trf','transport','transports','transportation','services','service','stores','store','shop','enterprises','enterprise','nigeria','nig','company','group','logistics','motors','global','ventures','venture','trading','traders','supplies','supply','mart','kitchen','market'];return norm(s).split(' ').filter(w=>w.length>=3&&!G.includes(w))}
function tryMatch(b){if(b.state==='matched')return;const c=S.items.filter(i=>!i.bank&&i.status!=='rejected'&&total(i)===b.amt&&(b.nd||Math.abs(i.t-b.t)<=3*864e5)),w=nm(b.desc),g=c.find(i=>nm(i.to).some(k=>w.includes(k)));
 if(g){g.bank=b.ref;b.xid=g.id;b.state='matched';b.cands=[];ev(g,'System','Bank record '+b.ref+' matched: '+N(b.amt)+' '+b.desc);return}
 if(c.length){b.state='possible';b.cands=c.map(i=>i.id)}else{b.state='unmatched';b.cands=[]}}
function recon(){if(!OWN)return toast('Only the owner can do this');const ls=document.getElementById('bk').value.split('\n').map(l=>l.trim()).filter(Boolean),seen={};let dup=0,add=0;
 ls.forEach(l=>{const p=l.split(','),t=Date.parse((p[0]||'').trim()),a=+String(p[1]||'').replace(/[^0-9.]/g,''),d=p.slice(2).join(',').trim();seen[l]=(seen[l]||0)+1;const ref='BANK-'+hsh(l+'#'+seen[l]).slice(0,6).toUpperCase();
  if(S.bl.some(b=>b.ref===ref)){dup++;return}S.bl.push({ref,t:isNaN(t)?NOW():t,nd:isNaN(t),amt:a,desc:d,xid:null,state:'unmatched',cands:[]});add++});
 const before=S.bl.filter(b=>b.state==='matched').length;S.bl.forEach(tryMatch);const gained=S.bl.filter(b=>b.state==='matched').length-before;
 save();render();toast(add+' new line(s), '+gained+' matched'+(dup?', '+dup+' already on file':''))}
render();
</script></body></html>
